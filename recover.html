<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글림 데이터 복구</title>
<style>
*{box-sizing:border-box;} body{font-family:'Malgun Gothic',sans-serif;background:#f1effc;margin:0;padding:18px;color:#241f47;}
.wrap{max-width:760px;margin:0 auto;}
h1{color:#5a48c4;font-size:22px;margin:0 0 4px;} .sub{color:#8b87a8;font-size:14px;margin-bottom:16px;}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 0 rgba(90,72,196,.10);margin-bottom:14px;}
.card h2{font-size:16px;color:#5a48c4;margin:0 0 10px;}
table{width:100%;border-collapse:collapse;font-size:14px;} td{padding:6px 4px;border-bottom:1px solid #eee;}
td:first-child{color:#8b87a8;width:44%;}
button{background:#6a5ae0;color:#fff;border:none;border-radius:12px;padding:13px 18px;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #4b3fb0;margin:6px 6px 0 0;}
button.alt{background:#fff;color:#5a48c4;border:2px solid #b9aef0;box-shadow:0 4px 0 #ddd8f5;}
button:disabled{opacity:.5;}
#log{background:#231f36;color:#d8d4ee;border-radius:12px;padding:12px;font-size:13px;height:220px;overflow:auto;white-space:pre-wrap;line-height:1.45;}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
input[type=date]{padding:8px;border:2px solid #ddd8f5;border-radius:10px;font-family:inherit;font-size:14px;}
.ok{color:#2fa85a;font-weight:bold;} .bad{color:#e05555;font-weight:bold;}
</style></head><body><div class="wrap">
<h1>글림 데이터 복구 도구</h1>
<div class="sub">이 태블릿에 남아 있는 기록을 찾아 서버로 다시 보냅니다. 반드시 파일럿 때 사용한 주소에서 열어야 합니다.</div>

<div class="card"><h2>1. 진단</h2><table id="diag"><tr><td>검사 중…</td><td></td></tr></table></div>

<div class="card"><h2>2. 전송</h2>
  <div class="row">기간
    <input type="date" id="from" value="2026-07-21">~
    <input type="date" id="to" value="2026-07-22">
    <label style="font-size:13px;color:#8b87a8;"><input type="checkbox" id="all"> 전체 기간</label>
  </div>
  <button id="bq">① 미전송 큐 보내기</button>
  <button id="bl">② 기록 복원 보내기</button>
  <button id="bx" class="alt">③ 파일로 내보내기</button>
</div>

<div class="card"><h2>3. 진행 상황</h2><div id="log">대기 중…</div></div>
</div>
<script>
'use strict';
var CFG={url:"https://citntimephlbdmntegia.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpdG50aW1lcGhsYmRtbnRlZ2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NTU4MTMsImV4cCI6MjEwMDAzMTgxM30.zN5rpEuQPliwyqxV9I7pBp1hsd1yPc_DO6qTJLQtrlg",table:"glim_l0_events"};
var L=document.getElementById('log');
function log(m,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=m;L.appendChild(d);L.scrollTop=L.scrollHeight;}
function J(v){try{return JSON.parse(v);}catch(e){return null;}}
function uuid(){return 'rec-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}

/* ---------- 저장소 스캔 ---------- */
function allStores(){
  var out=[{name:'현재',data:{}}];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k&&k.indexOf('glim_')===0&&k.indexOf('glim_stu_')!==0&&k.indexOf('glim_bak_')!==0)out[0].data[k]=localStorage.getItem(k);}
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k&&(k.indexOf('glim_stu_')===0||k.indexOf('glim_bak_')===0)){
      var o=J(localStorage.getItem(k)); if(o&&typeof o==='object')out.push({name:k,data:o});}}
  return out;
}
function collect(){
  var stores=allStores(), rows=[], queue=[], seen={};
  stores.forEach(function(st){
    var l0=J(st.data['glim_m2_L0_v1'])||[];
    l0.forEach(function(r){var k=[r.sid,r.s,r.st,r.t].join('|'); if(!seen[k]){seen[k]=1;rows.push(r);}});
    var q=J(st.data['glim_supabase_queue_v1'])||[];
    q.forEach(function(it){if(it&&it.id&&!seen['q'+it.id]){seen['q'+it.id]=1;queue.push(it);}});
  });
  return {rows:rows,queue:queue,stores:stores.length,
    sid:(localStorage.getItem('glim_sid')||''),dev:(localStorage.getItem('glim_device_id_v1')||'')};
}
function dstr(ms){var d=new Date(ms+9*3600*1000);return d.toISOString().slice(0,10);}

/* ---------- 진단 ---------- */
var D=collect();
(function diag(){
  var t=document.getElementById('diag'); t.innerHTML='';
  var ts=D.rows.map(function(r){return r.t;}).filter(Boolean).sort();
  var byDay={}; D.rows.forEach(function(r){if(r.t){var d=dstr(r.t);byDay[d]=(byDay[d]||0)+1;}});
  var days=Object.keys(byDay).sort().map(function(d){return d+' ('+byDay[d]+')';}).join(', ')||'없음';
  var errs={}; D.queue.forEach(function(q){var e=q.last_error||'(시도 전)';errs[e]=(errs[e]||0)+1;});
  var errTxt=Object.keys(errs).map(function(e){return e+' ×'+errs[e];}).join(' / ')||'-';
  function add(a,b,cls){t.innerHTML+='<tr><td>'+a+'</td><td'+(cls?' class="'+cls+'"':'')+'>'+b+'</td></tr>';}
  add('학생 번호', D.sid||'(없음)');
  add('기기 ID', D.dev||'(없음)');
  add('저장 공간(서랍·백업 포함)', D.stores+'곳');
  add('미전송 큐', D.queue.length+'건', D.queue.length?'ok':'');
  add('큐 실패 사유', errTxt, D.queue.length?'bad':'');
  add('로컬 기록(문항 행)', D.rows.length+'행', D.rows.length?'ok':'bad');
  add('기록 날짜별', days);
  log('진단 완료 — 큐 '+D.queue.length+'건, 기록 '+D.rows.length+'행');
})();

/* ---------- 전송 ---------- */
function post(row){
  return fetch(CFG.url+'/rest/v1/'+CFG.table,{method:'POST',
    headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(row)}).then(function(r){
      if(r.status===409)return 'dup';
      if(!r.ok)return r.text().then(function(t){throw new Error(r.status+': '+t.slice(0,160));});
      return 'ok';});
}
function inRange(ms){
  if(document.getElementById('all').checked)return true;
  var d=dstr(ms); return d>=document.getElementById('from').value && d<=document.getElementById('to').value;
}
function runSeq(items, fn, done){
  var i=0,ok=0,dup=0,fail=0;
  (function next(){
    if(i>=items.length){log('완료 — 성공 '+ok+' / 중복 '+dup+' / 실패 '+fail, fail?'bad':'ok');if(done)done();return;}
    fn(items[i]).then(function(r){ if(r==='dup')dup++; else ok++; })
      .catch(function(e){fail++;log('  실패: '+e.message,'bad');})
      .then(function(){ i++; if(i%10===0)log('  '+i+'/'+items.length+' 처리…'); setTimeout(next,60); });
  })();
}
document.getElementById('bq').addEventListener('click',function(){
  var q=D.queue.filter(function(it){return it&&it.row;});
  if(!q.length){log('보낼 큐가 없습니다.');return;}
  log('① 큐 '+q.length+'건 전송 시작…');
  runSeq(q,function(it){
    var row=Object.assign({event_id:it.id,device_id:D.dev},it.row);
    return post(row).then(function(r){
      var cur=J(localStorage.getItem('glim_supabase_queue_v1'))||[];
      var idx=cur.findIndex(function(x){return x.id===it.id;});
      if(idx>=0){cur.splice(idx,1);localStorage.setItem('glim_supabase_queue_v1',JSON.stringify(cur));}
      return r;});
  });
});
document.getElementById('bl').addEventListener('click',function(){
  var g={};
  D.rows.forEach(function(r){ if(!r.t||!inRange(r.t))return;
    var k=(r.sid||D.sid)+'|'+r.s+'|'+r.st; (g[k]=g[k]||[]).push(r); });
  var keys=Object.keys(g);
  if(!keys.length){log('해당 기간에 복원할 기록이 없습니다.');return;}
  log('② 기록 '+keys.length+'판 복원 전송 시작…');
  runSeq(keys,function(k){
    var rows=g[k].sort(function(a,b){return a.t-b.t;}), f=rows[0], last=rows[rows.length-1];
    var okN=rows.filter(function(x){return x.ok===1;}).length;
    var row={event_id:uuid(),device_id:D.dev,
      student_id:String(f.sid||D.sid||''),session_id:String(f.s||''),
      created_at:new Date(f.t).toISOString(),
      payload:{kind:'stage_trials',tv:'s4',recovered:1,recovered_at:Date.now(),
        sid:String(f.sid||D.sid||''),session:f.s,stage:f.st,set:f.set,
        trial_count:rows.length,correct_count:okN,wrong_count:rows.length-okN,
        accuracy:rows.length?okN/rows.length:0,trials:rows,saved_at:last.t}};
    return post(row).catch(function(e){
      if(String(e.message).indexOf('created_at')>=0){delete row.created_at;return post(row);}
      throw e;});
  });
});
document.getElementById('bx').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify({sid:D.sid,device:D.dev,queue:D.queue,rows:D.rows},null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='glim_backup_'+(D.sid||'x')+'_'+Date.now()+'.json';a.click();
  log('③ 파일 내보내기 완료 — 다운로드 폴더 확인');
});
</script></body></html>
