<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글림 진행 복원 — 16번</title>
<style>body{font-family:'Malgun Gothic',sans-serif;background:#f1effc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
.card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 8px 0 rgba(90,72,196,.12);text-align:center;max-width:420px;}
h1{color:#5a48c4;font-size:22px;margin:0 0 8px;}
p{color:#8b87a8;font-size:15px;line-height:1.5;}
.ok{color:#2fa85a;font-size:17px;font-weight:bold;margin-top:14px;}
button{margin-top:18px;background:#6a5ae0;color:#fff;border:none;border-radius:14px;padding:14px 26px;font-size:17px;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #4b3fb0;}
</style></head><body><div class="card">
<h1>16번 학생 진행 복원</h1>
<p>8월 4일 서버 기록 기준<br>단어나라 1 완주(39단계) + 단어나라 2 13단계</p>
<div id="st"></div>
<button id="go">복원 실행</button>
</div>
<script>
'use strict';
var W1={"0": 3, "1": 3, "2": 3, "3": 3, "4": 3, "5": 3, "6": 2, "7": 2, "8": 3, "9": 3, "10": 3, "11": 2, "12": 2, "13": 3, "14": 3, "15": 3, "16": 3, "17": 2, "18": 3, "19": 2, "20": 2, "21": 3, "22": 3, "23": 3, "24": 3, "25": 3, "26": 3, "27": 3, "28": 3, "29": 3, "30": 3, "31": 2, "32": 3, "33": 2, "34": 2, "35": 3, "36": 3, "37": 3, "38": 2};
var W2={"0": 3, "1": 2, "2": 2, "3": 3, "4": 3, "5": 2, "6": 2, "7": 2, "8": 3, "9": 2, "10": 3, "11": 2, "12": 2};
document.getElementById('go').addEventListener('click', function(){
  try{
    var KEY='glim_app_prog_v173';
    var p={}; try{ p=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ p={}; }
    ['단어나라','음절나라','음소나라','단어나라1','단어나라2','단어나라3',
     '음절나라1','음절나라2','음절나라3','음소나라1','음소나라2','음소나라3'].forEach(function(k){
      if(!p[k]) p[k]={unlocked:1,stars:{}};
    });
    p['단어나라1'].stars=W1; p['단어나라1'].unlocked=39;          /* 완주 */
    p['단어나라2'].stars=W2; p['단어나라2'].unlocked=Math.min(39,14); /* 13클리어 → 14 개방 */
    localStorage.setItem(KEY, JSON.stringify(p));
    localStorage.setItem('glim_sid','16');
    document.getElementById('st').innerHTML='<div class="ok">복원 완료 ✓<br>단어나라 1: 39단계 완주 (단어나라 2 개방)<br>단어나라 2: 13단계 클리어 · 14단계 개방<br>학생 번호 16 설정됨</div><p>이제 게임 주소로 접속하면 이어집니다.</p>';
    document.getElementById('go').style.display='none';
  }catch(e){
    document.getElementById('st').innerHTML='<div style="color:#e05555;">오류: '+e.message+'</div>';
  }
});
</script></body></html>
